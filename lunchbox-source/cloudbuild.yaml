substitutions:
  _REGION: asia-south1
  _SERVICE: lunchbox
  _REPOSITORY: lunchbox

steps:
  - id: test
    name: node:22
    entrypoint: npm
    args: ["ci"]
  - id: verify
    name: node:22
    entrypoint: npm
    args: ["test"]
    waitFor: ["test"]
  - id: build-app
    name: node:22
    entrypoint: npm
    args: ["run", "build"]
    waitFor: ["test"]
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "NEXT_PUBLIC_ENABLE_PHONE_AUTH=false", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}", "."]
    waitFor: ["verify", "build-app"]
  - id: push-image
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}"]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --update-env-vars=GCP_PROJECT_ID=${PROJECT_ID},REQUIRE_FIREBASE_AUTH=false,DEFAULT_DAILY_CAPACITY=1500,FRANCHISE_NETWORK_TARGET=198,FRANCHISE_DAILY_STUDENT_CAPACITY=1500

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}

options:
  logging: CLOUD_LOGGING_ONLY
