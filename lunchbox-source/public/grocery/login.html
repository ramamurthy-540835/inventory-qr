<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to Nelture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/register.css">
</head>
<body>
  <main class="page-shell">
    <section class="brand-panel"><a class="brand" href="/app/"><img class="brand-mark" src="/nelture-logo.png" alt=""><span>Nelture<span class="dot">.ai</span></span></a><div class="intro"><p class="eyebrow">WELCOME BACK</p><h1>Your basket,<br><em>ready when you are.</em></h1><p class="intro-copy">Sign in to access your saved address, previous orders and personalized grocery experience.</p></div><p class="panel-footer">© 2026 Nelture.ai · Made for everyday living</p></section>
    <section class="form-panel"><div class="form-wrap"><a class="mobile-brand brand" href="/app/"><img class="brand-mark" src="/nelture-logo.png" alt=""><span>Nelture<span class="dot">.ai</span></span></a><p class="step"><span>01</span> / 02 &nbsp; SIGN IN</p><h2>Welcome back</h2><p class="subhead">New to Nelture? <a href="/register">Create an account</a></p><form id="login-form" novalidate><div class="field-group full"><label for="login">Mobile number or email address</label><input id="login" name="login" type="text" inputmode="email" autocomplete="username" placeholder="10-digit mobile number or email" required><span class="field-error"></span></div><button class="submit-btn" type="submit"><span>Sign in to account</span><b>→</b></button><p id="form-message" class="form-message" role="status" aria-live="polite"></p></form></div></section>
  </main><script src="/login.js"></script>
</body>
</html>
