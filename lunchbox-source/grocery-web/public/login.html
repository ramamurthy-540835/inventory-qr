<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Nelture Grocery</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f8f1;color:#17251b}.card{max-width:420px;margin:8vh auto;background:#fff;padding:32px;border-radius:24px;box-shadow:0 16px 40px #17351d22}img{width:52px;border-radius:14px}h1{margin:14px 0 6px}p{color:#597060;line-height:1.5}label{display:block;margin-top:18px;font-weight:700;font-size:14px}input{box-sizing:border-box;width:100%;margin-top:7px;padding:14px;border:1px solid #ced9ce;border-radius:12px;font-size:16px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:#237541;color:#fff;font-weight:800;font-size:15px}a{color:#237541;font-weight:700}#message{min-height:22px;color:#b42318}</style></head><body><main class="card"><a href="/grocery/"><img src="/grocery/nelture-logo.png" alt="Nelture"></a><h1>Welcome back</h1><p>Sign in to continue your grocery order.</p><form id="form"><label>Mobile number or email<input name="login" required placeholder="10-digit mobile number or email"></label><button>Sign in</button><p id="message"></p></form><p>New to Nelture? <a href="/grocery/register.html">Create an account</a></p></main><script>const f=document.querySelector('#form'),m=document.querySelector('#message');f.onsubmit=async e=>{e.preventDefault();m.textContent='';const r=await fetch('/grocery-api/customers/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:f.login.value.trim()})}),d=await r.json();if(!r.ok){m.textContent=d.error||'Unable to sign in.';return}localStorage.setItem('nelture-customer',JSON.stringify(d));location.assign('/grocery/')}</script></body></html>
