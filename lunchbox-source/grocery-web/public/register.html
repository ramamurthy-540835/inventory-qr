<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Nelture Grocery</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f8f1;color:#17251b}.card{max-width:520px;margin:4vh auto;background:#fff;padding:28px;border-radius:24px;box-shadow:0 16px 40px #17351d22}img{width:48px;border-radius:14px}h1{margin:12px 0 6px}p{color:#597060}label{display:block;margin-top:12px;font-weight:700;font-size:13px}input,textarea{box-sizing:border-box;width:100%;margin-top:6px;padding:12px;border:1px solid #ced9ce;border-radius:10px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#237541;color:#fff;font-weight:800}a{color:#237541;font-weight:700}#message{color:#b42318}</style></head><body><main class="card"><a href="/grocery/"><img src="/grocery/nelture-logo.png" alt="Nelture"></a><h1>Create your grocery account</h1><p>Save your delivery details and check out securely.</p><form id="form"><label>Name<input name="customer_name" required></label><label>Mobile number<input name="phone_number" inputmode="numeric" required></label><label>Email (optional)<input name="email" type="email"></label><label>Address<textarea name="address" required></textarea></label><div class="row"><label>PIN code<input name="postal_code" inputmode="numeric" required></label><label>City<input name="city" value="Chennai" required></label></div><label>State<input name="state" value="Tamil Nadu" required></label><label>Choose customer ID<input name="customer_id" required placeholder="e.g. ARCH001"></label><button>Create account</button><p id="message"></p></form><p>Already registered? <a href="/grocery/login.html">Sign in</a></p></main><script>const f=document.querySelector('#form'),m=document.querySelector('#message');f.onsubmit=async e=>{e.preventDefault();m.textContent='';const d=Object.fromEntries(new FormData(f));d.phone_number='+91'+d.phone_number.replace(/\D/g,'').slice(-10);const r=await fetch('/grocery-api/customers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(!r.ok){m.textContent=j.error||'Unable to create account.';return}localStorage.setItem('nelture-customer',JSON.stringify(j));location.assign('/grocery/')}</script></body></html>
